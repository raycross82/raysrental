[build]
# Literal string ('''): no TOML escaping, so the sed expressions read as-is.
# site-overlay/ holds hand-maintained pages layered on top of the zip contents.
# The old quote/thanks/ page lives inside raysrental-deploy.zip, so it is removed
# from the unpacked output rather than by rewriting the archive. This stays correct
# even if the archive is re-uploaded with the page still in it.
#
# raysrental-deploy.zip ALSO carries its own stale netlify.toml at the archive root.
# Unpacking it lands a netlify.toml inside the publish directory, which becomes the
# deploy's effective config and silently shadows this file -- its older, shorter
# redirect list wins and any rule added here is dropped without an error. Delete it
# after unpacking, and assert it is gone so a re-uploaded archive cannot regress this.
#
# reviews-section.html is injected into the homepage the same way promo-strip.html is,
# so the homepage stays owned by the archive. `sed '/pat/e cat file'` writes the file
# out BEFORE the matched line (GNU sed), which puts reviews ahead of the final CTA band.
# The footer "Reviews" link is appended after the Explore > Contact item on every page.
# Each injection is asserted below so a re-uploaded archive that moves these anchors
# fails the build instead of silently dropping the section or the link.
#
# Headings that run text straight into a <br> (`<h1>DFW Event Rentals<br>Made Easy</h1>`)
# read as one word to anything that flattens the markup -- screen readers, search
# snippets, copy/paste. A space is inserted before the break in every heading that has
# this shape. Purely a text-content fix: with white-space:normal a space at the end of a
# line is dropped during layout, so the rendered two-line heading is byte-for-byte the
# same on screen. This runs after the injections above so fragment headings are covered
# too, and the archive keeps owning the pages. The assertion is the general pattern
# rather than one string, so a re-uploaded archive that reintroduces it anywhere fails
# the build.
#
# The Cedar Hill, DeSoto, Waxahachie, Red Oak and Duncanville city pages are authored in
# site-overlay/, but the three places that link to a city list are archive-owned: sitemap.xml
# (from seo-update.zip, which wins over the deploy archive's copy), the "Top Cities" footer block
# on every page, and the service-areas chip row. Those are patched here rather than by shipping
# edited copies, so a re-uploaded archive keeps ownership of them and cannot silently revert to a
# stale 16-city list. The footer sed runs across every page including the overlay's own, so the
# overlay city pages carry the archive's 8-city footer and pick up the additions with everyone
# else. Each patch is asserted below: if an archive upload moves an anchor, the build fails
# instead of quietly dropping the new cities out of the sitemap or the internal links.
#
# The /quote/ lead form is archive-owned too, so its field changes are patched here rather
# than by shipping an edited copy in site-overlay/ -- the same page carries the package and
# a-la-carte pricing, and a frozen overlay copy would silently mask a re-uploaded archive's
# price updates. The three date fields (Date Needed + two datetime-local pickers) collapse to
# one required date plus two optional selects, and an optional email is added beside the phone.
# The form name, honeypot, hidden form-name field and /thank-you/ action are all asserted
# below, along with the absence of any datetime-local input, so a re-uploaded archive that
# moves these anchors fails the build instead of silently shipping the old five-field form or
# a form that no longer registers with Netlify.
command = '''rm -rf out && mkdir out && unzip -o raysrental-deploy.zip -d out && unzip -o seo-update.zip -d out && cp -R site-overlay/. out/ && rm -f out/netlify.toml && rm -rf out/quote/thanks && sed -i '/<\/header>/r promo-strip.html' out/index.html && sed -i '/<section class="cta-band">/e cat reviews-section.html' out/index.html && find out -name '*.html' -exec sed -i 's|<li><a href="/contact/">Contact</a></li>|&<li><a href="/review/">Reviews</a></li>|' {} + && find out -name '*.html' -exec sed -i 's|<li><a href="/party-rentals/grand-prairie/">Grand Prairie</a></li>|&<li><a href="/party-rentals/cedar-hill/">Cedar Hill</a></li><li><a href="/party-rentals/desoto/">DeSoto</a></li><li><a href="/party-rentals/duncanville/">Duncanville</a></li><li><a href="/party-rentals/waxahachie/">Waxahachie</a></li><li><a href="/party-rentals/red-oak/">Red Oak</a></li>|' {} + && sed -i 's|<a class="chip" href="/party-rentals/euless/">Euless</a>|&\n<a class="chip" href="/party-rentals/cedar-hill/">Cedar Hill</a>\n<a class="chip" href="/party-rentals/desoto/">DeSoto</a>\n<a class="chip" href="/party-rentals/duncanville/">Duncanville</a>\n<a class="chip" href="/party-rentals/waxahachie/">Waxahachie</a>\n<a class="chip" href="/party-rentals/red-oak/">Red Oak</a>|' out/service-areas/index.html && sed -i 's|</urlset>|<url><loc>https://raysrental.com/party-rentals/cedar-hill/</loc><lastmod>2026-08-06</lastmod></url>\n<url><loc>https://raysrental.com/party-rentals/desoto/</loc><lastmod>2026-08-06</lastmod></url>\n<url><loc>https://raysrental.com/party-rentals/waxahachie/</loc><lastmod>2026-08-08</lastmod></url>\n<url><loc>https://raysrental.com/party-rentals/red-oak/</loc><lastmod>2026-08-08</lastmod></url>\n<url><loc>https://raysrental.com/party-rentals/duncanville/</loc><lastmod>2026-08-08</lastmod></url>\n&|' out/sitemap.xml &&find out -name '*.html' -exec sed -i 's|\(<h[1-6][^>]*>[^<]*[^[:space:]]\)\(<br[^>]*>\)|\1 \2|g' {} + && sed -i 's|action="/quote/thanks/"|action="/thank-you/"|' out/quote/index.html && sed -i 's|<input type="hidden" name="items" id="f-items">|<input type="hidden" name="form-name" value="quote">&|' out/quote/index.html && sed -i 's|name="phone" type="tel" required autocomplete="tel"></div>|&<div><label for="i-email">Email (optional)</label><input id="i-email" name="email" type="email" autocomplete="email"></div>|' out/quote/index.html && sed -i 's|>Date Needed \*</label>|>Date of Your Event *</label>|' out/quote/index.html && sed -i 's|<div></div>||' out/quote/index.html && sed -i 's|<div><label for="i-start">Pickup Date &amp; Time \*</label><input id="i-start" name="startTime" type="datetime-local" required></div>|<div><label for="i-dropoff">Drop-off timing</label><select id="i-dropoff" name="dropoffTiming"><option value="Evening before the event" selected>Evening before the event (most popular)</option><option value="Morning of the event">Morning of the event</option><option value="Afternoon of the event">Afternoon of the event</option><option value="Not sure yet - Ray will confirm">Not sure yet - Ray will confirm</option></select></div>|' out/quote/index.html && sed -i 's|<div><label for="i-end">Return Date &amp; Time \*</label><input id="i-end" name="endTime" type="datetime-local" required></div>|<div><label for="i-pickup">Pick-up timing</label><select id="i-pickup" name="pickupTiming"><option value="Morning after the event" selected>Morning after the event (most popular)</option><option value="Same night after the event">Same night after the event</option><option value="Next evening">Next evening</option><option value="Not sure yet - Ray will confirm">Not sure yet - Ray will confirm</option></select></div><p class="legend-sub" style="grid-column:1/-1;margin-bottom:0">We\&rsquo;ll confirm exact times by text before your event.</p>|' out/quote/index.html && grep -q 'action="/thank-you/"' out/quote/index.html && grep -q '<form name="quote" method="POST"' out/quote/index.html && grep -q 'data-netlify="true" netlify-honeypot="bot-field"' out/quote/index.html && grep -q '<input type="hidden" name="form-name" value="quote">' out/quote/index.html && grep -q 'name="bot-field"' out/quote/index.html && grep -q '<input id="i-email" name="email" type="email" autocomplete="email">' out/quote/index.html && grep -q '>Date of Your Event \*</label><input id="i-date" name="date" type="date" required>' out/quote/index.html && grep -q 'name="dropoffTiming"' out/quote/index.html && grep -q 'name="pickupTiming"' out/quote/index.html && grep -q 'confirm exact times by text before your event' out/quote/index.html && ! grep -q 'datetime-local' out/quote/index.html && ! grep -q '<div></div>' out/quote/index.html &&grep -q 'id="reviews"' out/index.html && grep -q '<li><a href="/review/">Reviews</a></li>' out/index.html && grep -q '<li><a href="/review/">Reviews</a></li>' out/faq/index.html && grep -q '<h1>DFW Event Rentals <br>Made Easy</h1>' out/index.html && ! grep -rE '<h[1-6][^>]*>[^<]*[^[:space:]]<br' out --include='*.html' && test ! -e out/quote/thanks && test ! -e out/netlify.toml && test -e out/party-rentals/cedar-hill/index.html && test -e out/party-rentals/desoto/index.html && test -e out/party-rentals/waxahachie/index.html && test -e out/party-rentals/red-oak/index.html && test -e out/party-rentals/duncanville/index.html && grep -q '<loc>https://raysrental.com/party-rentals/cedar-hill/</loc>' out/sitemap.xml && grep -q '<loc>https://raysrental.com/party-rentals/desoto/</loc>' out/sitemap.xml && grep -q '<loc>https://raysrental.com/party-rentals/waxahachie/</loc>' out/sitemap.xml && grep -q '<loc>https://raysrental.com/party-rentals/red-oak/</loc>' out/sitemap.xml && grep -q '<loc>https://raysrental.com/party-rentals/duncanville/</loc>' out/sitemap.xml && grep -q '<a class="chip" href="/party-rentals/cedar-hill/">Cedar Hill</a>' out/service-areas/index.html && grep -q '<a class="chip" href="/party-rentals/desoto/">DeSoto</a>' out/service-areas/index.html && grep -q '<a class="chip" href="/party-rentals/waxahachie/">Waxahachie</a>' out/service-areas/index.html && grep -q '<a class="chip" href="/party-rentals/red-oak/">Red Oak</a>' out/service-areas/index.html && grep -q '<a class="chip" href="/party-rentals/duncanville/">Duncanville</a>' out/service-areas/index.html && grep -q '<li><a href="/party-rentals/cedar-hill/">Cedar Hill</a></li>' out/index.html && grep -q '<li><a href="/party-rentals/desoto/">DeSoto</a></li>' out/index.html && grep -q '<li><a href="/party-rentals/waxahachie/">Waxahachie</a></li>' out/index.html && grep -q '<li><a href="/party-rentals/red-oak/">Red Oak</a></li>' out/index.html && grep -q '<li><a href="/party-rentals/duncanville/">Duncanville</a></li>' out/index.html && grep -q '<li><a href="/party-rentals/cedar-hill/">Cedar Hill</a></li>' out/party-rentals/desoto/index.html && grep -q '<li><a href="/party-rentals/desoto/">DeSoto</a></li>' out/party-rentals/cedar-hill/index.html && grep -q '<li><a href="/party-rentals/red-oak/">Red Oak</a></li>' out/party-rentals/waxahachie/index.html && grep -q '<li><a href="/party-rentals/duncanville/">Duncanville</a></li>' out/party-rentals/red-oak/index.html && grep -q '<li><a href="/party-rentals/waxahachie/">Waxahachie</a></li>' out/party-rentals/duncanville/index.html'''
publish = "out"

