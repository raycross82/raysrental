from = "/Rays Rentals Netlify Ready.zip"
to = "/"
status = 301
force = true

[[redirects]]
from = "/review"
to = "https://search.google.com/local/writereview?placeid=ChIJZ1qgnrDGGw4R8tmVd2rxE_s"
status = 302
force = true

[[redirects]]
from = "/review/"
to = "https://search.google.com/local/writereview?placeid=ChIJZ1qgnrDGGw4R8tmVd2rxE_s"
status = 302
force = true

[[redirects]]
from = "/reviews"
to = "https://search.google.com/local/writereview?placeid=ChIJZ1qgnrDGGw4R8tmVd2rxE_s"
status = 302
force = true

[[redirects]]
from = "/reviews/"
to = "https://search.google.com/local/writereview?placeid=ChIJZ1qgnrDGGw4R8tmVd2rxE_s"
status = 302
force = true

# /pricing is a common guess for the price list, which lives at /inventory/
[[redirects]]
from = "/pricing"
to = "/inventory/"
status = 301
force = true

[[headers]]
for = "/assets/img/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/css/*"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/assets/js/*"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
