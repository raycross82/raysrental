[build]
# Literal string ('''): no TOML escaping, so the sed expressions read as-is.
# site-overlay/ holds hand-maintained pages layered on top of the zip contents.
# The old quote/thanks/ page lives inside raysrental-deploy.zip, so it is removed
# from the unpacked output rather than by rewriting the archive. This stays correct
# even if the archive is re-uploaded with the page still in it.
#
# raysrental-deploy.zip ALSO carries its own stale netlify.toml at the archive root.
# Unpacking it lands a netlify.toml inside the publish directory, which becomes the
# deploy's effective config and silently shadows this file -- its older, shorter
# redirect list wins and any rule added here is dropped without an error. Delete it
# after unpacking, and assert it is gone so a re-uploaded archive cannot regress this.
#
# reviews-section.html is injected into the homepage the same way promo-strip.html is,
# so the homepage stays owned by the archive. `sed '/pat/e cat file'` writes the file
# out BEFORE the matched line (GNU sed), which puts reviews ahead of the final CTA band.
# The footer "Reviews" link is appended after the Explore > Contact item on every page.
# Each injection is asserted below so a re-uploaded archive that moves these anchors
# fails the build instead of silently dropping the section or the link.
#
# Headings that run text straight into a <br> (`<h1>DFW Event Rentals<br>Made Easy</h1>`)
# read as one word to anything that flattens the markup -- screen readers, search
# snippets, copy/paste. A space is inserted before the break in every heading that has
# this shape. Purely a text-content fix: with white-space:normal a space at the end of a
# line is dropped during layout, so the rendered two-line heading is byte-for-byte the
# same on screen. This runs after the injections above so fragment headings are covered
# too, and the archive keeps owning the pages. The assertion is the general pattern
# rather than one string, so a re-uploaded archive that reintroduces it anywhere fails
# the build.
#
# The Cedar Hill, DeSoto, Waxahachie, Red Oak and Duncanville city pages are authored in
# site-overlay/, but the three places that link to a city list are archive-owned: sitemap.xml
# (from seo-update.zip, which wins over the deploy archive's copy), the "Top Cities" footer block
# on every page, and the service-areas chip row. Those are patched here rather than by shipping
# edited copies, so a re-uploaded archive keeps ownership of them and cannot silently revert to a
# stale 16-city list. The footer sed runs across every page including the overlay's own, so the
# overlay city pages carry the archive's 8-city footer and pick up the additions with everyone
# else. Each patch is asserted below: if an archive upload moves an anchor, the build fails
# instead of quietly dropping the new cities out of the sitemap or the internal links.
#
# The /inventory/ price list is archive-owned as well, and it is the one page that carries the
# live per-day rates, so its new blocks (quick answers, full price table, package comparison,
# rental terms) are injected here as fragments instead of shipping a frozen copy in site-overlay/.
# A frozen copy would keep rendering old prices after the archive is re-uploaded with new ones,
# which on a price list is the worst possible failure. The JSON-LD on that page is patched by
# scripts/patch-inventory-schema.mjs rather than sed: the whole graph sits on one line, and a
# mis-escaped sed replacement there yields invalid structured data that still renders fine in
# the browser. That script prepends the CollectionPage in inventory-schema-nodes.json and then
# upgrades the archive's own ItemList in place -- adding a second list for the same products
# would leave the graph self-contradicting -- and it re-parses the result and asserts every
# name, price and offer, so it fails the build rather than shipping broken schema.
# The visible "Updated August 2026" line is a plain sed on the H1. Each injection is asserted
# below, including that the quick-answers block landed exactly once, so a re-uploaded archive
# that moves an anchor fails the build instead of silently dropping a table.
#
# The /quote/ lead form is archive-owned too, so its field changes are patched here rather
# than by shipping an edited copy in site-overlay/ -- the same page carries the package and
# a-la-carte pricing, and a frozen overlay copy would silently mask a re-uploaded archive's
# price updates. The three date fields (Date Needed + two datetime-local pickers) collapse to
# one required date plus two optional selects, and an optional email is added beside the phone.
# The form name, honeypot, hidden form-name field and /thank-you/ action are all asserted
# below, along with the absence of any datetime-local input, so a re-uploaded archive that
# moves these anchors fails the build instead of silently shipping the old five-field form or
# a form that no longer registers with Netlify.
#
# quote-mobile-bar.html is injected into the same page for the same reason. style.css sets
# .summary-card{position:static} below 900px, so on a phone the running total drops out of the
# sticky rail into the page flow, thousands of pixels below the item picker -- adding chairs
# with no visible total. The fragment adds a fixed bottom bar at 900px and under carrying the
# live per-day total, a pre-filled "Text quote" SMS link and a Reserve button that scrolls to
# the form; .summary-card is left exactly where it is and stays the source of truth, since the
# bar reads #s-total and #f-items rather than re-deriving prices. It is injected before the
# archive's .callbar so the two sit together at the end of the body, and only on /quote/: the
# bar hides that callbar while it is up, because two stacked bars would eat ~115px of a small
# phone screen. scripts/assert-quote-bar.mjs re-reads the page and fails the build if any hook
# the bar depends on was renamed, if .summary-card or the callbar left, or if the markup ever
# reaches a second page -- a bar wired to a hook that no longer exists renders as a permanently
# empty cart rather than as an error.
#
# The bar is driven by the cart rather than watching for it. A one-line window.rrQuoteBar()
# call is appended to the end of renderSummary in out/assets/js/quote.js -- the function that
# already writes input[name=total] and input[name=items] -- so every recalculation updates the
# bar with the numbers the cart just wrote. Sniffing the DOM for changes instead is what makes
# a bar like this fail silently: the summary card is re-rendered as the quote changes, so an
# element captured at page load can be detached by the time the total moves, leaving a bar that
# renders perfectly and never leaves "$0 / day" while the cart works fine beside it. The call
# is guarded by `if(window.rrQuoteBar)`, so quote.js stays inert on any page without the bar,
# and scripts/assert-quote-bar.mjs asserts it landed inside renderSummary.
#
# /seating-calculator/ and /quinceanera-rentals/ are authored in site-overlay/, but the six
# places that have to link to them are archive-owned -- sitemap.xml, the /quote/ hero, the
# "dedicated guides" line on /event-rentals/, and the seating-guide line on the Dallas and Fort
# Worth city pages -- so those links are patched here rather than by shipping edited copies,
# for the same reason as the city list above: a frozen copy of /quote/ would mask a re-uploaded
# archive's form and price changes. The two city seds name their file explicitly instead of
# running under find, because the seating-guide sentence they anchor on is shared by several
# city pages and only Dallas and Fort Worth are supposed to gain the link. The /inventory/ link
# lives in inventory-price-table.html, which this repo already owns, so it needs no sed.
#
# scripts/assert-new-pages.mjs then re-parses both pages. It recomputes every row of the
# seating reference table with the same arithmetic the on-page calculator uses and fails the
# build if the hand-written table and the script ever disagree -- a page that answers the same
# question two different ways renders perfectly and is worse than one that answers neither. It
# also sweeps the whole publish directory for ItemList nodes and fails if any exists outside
# /inventory/, which is the one page that owns that entity, and checks the FAQPage on the
# quinceanera page question-for-question against the FAQ a visitor actually sees.
#
# /corporate-event-rentals/ is authored in site-overlay/ as well, and it needs the same two
# archive-owned hooks the pages above do: a sitemap entry and a link from the main nav. The
# nav sed runs over every page rather than being hard-coded into the overlay copy, because
# .main-nav is a single element -- style.css lays it out as a row above 940px and as the
# dropdown the hamburger opens at or below it -- so one inserted link is both the desktop and
# the mobile menu item, and inserting it here means the overlay pages pick it up with the
# archive's own pages instead of drifting to a shorter nav. It anchors on the "Build a Quote"
# CTA rather than the Contact link, since Contact appears in the footer "Explore" list too and
# an anchor that loose would put a nav item inside the footer. The overlay page therefore does
# NOT ship the Corporate link itself; if it did, this sed would give that one page two of them.
# scripts/assert-new-pages.mjs re-parses the page and recomputes all nineteen rows of the five
# room-setup tables against (tables x $8) + (chairs x $2) + $150, checks the six FAQ answers
# against the FAQPage schema word for word, and fails the build if the word "insurance" reaches
# the visible text -- there is no certificate of insurance yet, so the page carries a comment
# where that block goes and claiming coverage we do not have is the one error on this page that
# would be worse than a wrong price. It also asserts the page carries no ItemList, Product or
# Offer node anywhere in its graph, since /inventory/ owns the only product entity on this site.
# The business phone number is swapped sitewide by scripts/patch-phone.mjs, which runs over
# the unpacked output after every injection above rather than by shipping edited pages in
# site-overlay/. The old number is on essentially every page -- footer "Get in Touch", the
# sticky Call Ray / Text Us bar, contact, quote, inventory and all city landing pages -- and
# freezing that many archive-owned pages would mask every future content and price update
# the archive carries. Patching the output instead means a re-uploaded archive still gets
# the new number, silently and automatically. The patcher covers every spelling in one pass
# (tel:/sms: hrefs, E.164, parenthesised display text, dash/dot/space separated and bare
# digits) so it keeps working if an archive changes formatting. scripts/assert-phone.mjs
# then runs LAST, after every other sed and assertion, and greps all output text plus every
# parsed JSON-LD block for anything that still reads as the old number, failing the build if
# so. A dead number renders perfectly in a browser and in a deploy preview -- the only
# symptom is calls and texts going nowhere -- so this has to be a hard failure, not a warning.
command = '''rm -rf out && mkdir out && unzip -o raysrental-deploy.zip -d out && unzip -o seo-update.zip -d out && cp -R site-overlay/. out/ && rm -f out/netlify.toml && rm -rf out/quote/thanks && sed -i '/<\/header>/r promo-strip.html' out/index.html && sed -i '/<section class="cta-band">/e cat reviews-section.html' out/index.html && find out -name '*.html' -exec sed -i 's|<li><a href="/contact/">Contact</a></li>|&<li><a href="/review/">Reviews</a></li>|' {} + && find out -name '*.html' -exec sed -i 's|<a class="nav-cta" href="/quote/">Build a Quote</a>|<a href="/corporate-event-rentals/">Corporate</a>&|' {} + && find out -name '*.html' -exec sed -i 's|<li><a href="/party-rentals/grand-prairie/">Grand Prairie</a></li>|&<li><a href="/party-rentals/cedar-hill/">Cedar Hill</a></li><li><a href="/party-rentals/desoto/">DeSoto</a></li><li><a href="/party-rentals/duncanville/">Duncanville</a></li><li><a href="/party-rentals/waxahachie/">Waxahachie</a></li><li><a href="/party-rentals/red-oak/">Red Oak</a></li>|' {} + && sed -i 's|<a class="chip" href="/party-rentals/euless/">Euless</a>|&\n<a class="chip" href="/party-rentals/cedar-hill/">Cedar Hill</a>\n<a class="chip" href="/party-rentals/desoto/">DeSoto</a>\n<a class="chip" href="/party-rentals/duncanville/">Duncanville</a>\n<a class="chip" href="/party-rentals/waxahachie/">Waxahachie</a>\n<a class="chip" href="/party-rentals/red-oak/">Red Oak</a>|' out/service-areas/index.html && sed -i 's|</urlset>|<url><loc>https://raysrental.com/party-rentals/cedar-hill/</loc><lastmod>2026-08-06</lastmod></url>\n<url><loc>https://raysrental.com/party-rentals/desoto/</loc><lastmod>2026-08-06</lastmod></url>\n<url><loc>https://raysrental.com/party-rentals/waxahachie/</loc><lastmod>2026-08-08</lastmod></url>\n<url><loc>https://raysrental.com/party-rentals/red-oak/</loc><lastmod>2026-08-08</lastmod></url>\n<url><loc>https://raysrental.com/party-rentals/duncanville/</loc><lastmod>2026-08-08</lastmod></url>\n&|' out/sitemap.xml && sed -i 's|</urlset>|<url><loc>https://raysrental.com/seating-calculator/</loc><lastmod>2026-08-24</lastmod></url>\n<url><loc>https://raysrental.com/quinceanera-rentals/</loc><lastmod>2026-08-24</lastmod></url>\n&|' out/sitemap.xml && sed -i 's|</urlset>|<url><loc>https://raysrental.com/corporate-event-rentals/</loc><lastmod>2026-09-05</lastmod></url>\n&|' out/sitemap.xml && sed -i '/^<section>$/e cat inventory-quick-answers.html' out/inventory/index.html && sed -i '/<section style="background:#fff">/e cat inventory-price-table.html' out/inventory/index.html && sed -i '/<section class="cta-band">/e cat inventory-comparison-tables.html' out/inventory/index.html && sed -i 's|<h1>Everything We Rent</h1>|&<p class="rr-updated">Updated August 2026</p>|' out/inventory/index.html && node scripts/patch-inventory-schema.mjs &&find out -name '*.html' -exec sed -i 's|\(<h[1-6][^>]*>[^<]*[^[:space:]]\)\(<br[^>]*>\)|\1 \2|g' {} + && sed -i 's|action="/quote/thanks/"|action="/thank-you/"|' out/quote/index.html && sed -i 's|<input type="hidden" name="items" id="f-items">|<input type="hidden" name="form-name" value="quote">&|' out/quote/index.html && sed -i 's|name="phone" type="tel" required autocomplete="tel"></div>|&<div><label for="i-email">Email (optional)</label><input id="i-email" name="email" type="email" autocomplete="email"></div>|' out/quote/index.html && sed -i 's|>Date Needed \*</label>|>Date of Your Event *</label>|' out/quote/index.html && sed -i 's|<div></div>||' out/quote/index.html && sed -i 's|<div><label for="i-start">Pickup Date &amp; Time \*</label><input id="i-start" name="startTime" type="datetime-local" required></div>|<div><label for="i-dropoff">Drop-off timing</label><select id="i-dropoff" name="dropoffTiming"><option value="Evening before the event" selected>Evening before the event (most popular)</option><option value="Morning of the event">Morning of the event</option><option value="Afternoon of the event">Afternoon of the event</option><option value="Not sure yet - Ray will confirm">Not sure yet - Ray will confirm</option></select></div>|' out/quote/index.html && sed -i 's|<div><label for="i-end">Return Date &amp; Time \*</label><input id="i-end" name="endTime" type="datetime-local" required></div>|<div><label for="i-pickup">Pick-up timing</label><select id="i-pickup" name="pickupTiming"><option value="Morning after the event" selected>Morning after the event (most popular)</option><option value="Same night after the event">Same night after the event</option><option value="Next evening">Next evening</option><option value="Not sure yet - Ray will confirm">Not sure yet - Ray will confirm</option></select></div><p class="legend-sub" style="grid-column:1/-1;margin-bottom:0">We\&rsquo;ll confirm exact times by text before your event.</p>|' out/quote/index.html && sed -i 's|<p class="lead">Start with a package or build from scratch. Your total updates as you go.</p>|&<p class="lead" style="margin-top:12px">Not sure how many tables and chairs? <a href="/seating-calculator/" style="color:#E8A940">Work it out from your guest count</a> first.</p>|' out/quote/index.html && sed -i 's|<a href="/event-rentals/church-events/"><b>Church &amp; community events</b></a></p>|&<p style="margin-top:16px">Hosting a quincea\&ntilde;era? The <a href="/quinceanera-rentals/"><b>quincea\&ntilde;era rentals guide</b></a> maps packages to guest count and covers the 6-to-9-month booking timeline for spring and fall dates.</p>|' out/event-rentals/index.html && sed -i 's|<p>Not sure how much to rent? Our <a href="/blog/seating-guide/">seating guide</a> does the table-and-chair math for any guest count.</p>|&<p>Planning a quincea\&ntilde;era in Dallas? Our <a href="/quinceanera-rentals/">quincea\&ntilde;era rentals guide</a> covers packages by guest count, deposits and how far ahead to book.</p>|' out/party-rentals/dallas/index.html && sed -i 's|<p>Not sure how much to rent? Our <a href="/blog/seating-guide/">seating guide</a> does the table-and-chair math for any guest count.</p>|&<p>Planning a quincea\&ntilde;era in Fort Worth? Our <a href="/quinceanera-rentals/">quincea\&ntilde;era rentals guide</a> covers packages by guest count, deposits and how far ahead to book.</p>|' out/party-rentals/fort-worth/index.html && sed -i '/<div class="callbar" role="complementary" aria-label="Contact Ray">/e cat quote-mobile-bar.html' out/quote/index.html && sed -i 's|.value=fmt(s.deposit);|&if(window.rrQuoteBar)window.rrQuoteBar();|' out/assets/js/quote.js && node scripts/patch-phone.mjs && grep -q 'action="/thank-you/"' out/quote/index.html && grep -q '<form name="quote" method="POST"' out/quote/index.html && grep -q 'data-netlify="true" netlify-honeypot="bot-field"' out/quote/index.html && grep -q '<input type="hidden" name="form-name" value="quote">' out/quote/index.html && grep -q 'name="bot-field"' out/quote/index.html && grep -q '<input id="i-email" name="email" type="email" autocomplete="email">' out/quote/index.html && grep -q '>Date of Your Event \*</label><input id="i-date" name="date" type="date" required>' out/quote/index.html && grep -q 'name="dropoffTiming"' out/quote/index.html && grep -q 'name="pickupTiming"' out/quote/index.html && grep -q 'confirm exact times by text before your event' out/quote/index.html && ! grep -q 'datetime-local' out/quote/index.html && ! grep -q '<div></div>' out/quote/index.html && grep -q '<h2>Party Rental Prices in DFW at a Glance</h2>' out/inventory/index.html && test "$(grep -c 'Party Rental Prices in DFW at a Glance' out/inventory/index.html)" = 1 && grep -q '<h2>Full Price List</h2>' out/inventory/index.html && grep -q '<h2>Package Comparison</h2>' out/inventory/index.html && grep -q '<h2>Rental Terms</h2>' out/inventory/index.html && grep -q 'sanitized after each event' out/inventory/index.html && ! grep -q 'sanitised' out/inventory/index.html && grep -q '<caption>Ray.s Rentals per-day pricing, Dallas-Fort Worth, updated August 2026</caption>' out/inventory/index.html && grep -q 'class="rr-table"' out/inventory/index.html && grep -q 'class="rr-table rr-compare"' out/inventory/index.html && grep -q 'class="rr-table rr-terms"' out/inventory/index.html && grep -q '<h1>Everything We Rent</h1><p class="rr-updated">Updated August 2026</p>' out/inventory/index.html && grep -q 'href="/quote/?package=party60"' out/inventory/index.html && grep -q 'href="/quote/?package=cookout60"' out/inventory/index.html && grep -q 'href="/quote/?package=wholeparty"' out/inventory/index.html && grep -q 'G-Z6VJLTSTYQ' out/inventory/index.html &&grep -q 'id="reviews"' out/index.html && grep -q '<li><a href="/review/">Reviews</a></li>' out/index.html && grep -q '<li><a href="/review/">Reviews</a></li>' out/faq/index.html && grep -q '<h1>DFW Event Rentals <br>Made Easy</h1>' out/index.html && ! grep -rE '<h[1-6][^>]*>[^<]*[^[:space:]]<br' out --include='*.html' && test ! -e out/quote/thanks && test ! -e out/netlify.toml && test -e out/party-rentals/cedar-hill/index.html && test -e out/party-rentals/desoto/index.html && test -e out/party-rentals/waxahachie/index.html && test -e out/party-rentals/red-oak/index.html && test -e out/party-rentals/duncanville/index.html && grep -q '<loc>https://raysrental.com/party-rentals/cedar-hill/</loc>' out/sitemap.xml && grep -q '<loc>https://raysrental.com/party-rentals/desoto/</loc>' out/sitemap.xml && grep -q '<loc>https://raysrental.com/party-rentals/waxahachie/</loc>' out/sitemap.xml && grep -q '<loc>https://raysrental.com/party-rentals/red-oak/</loc>' out/sitemap.xml && grep -q '<loc>https://raysrental.com/party-rentals/duncanville/</loc>' out/sitemap.xml && grep -q '<a class="chip" href="/party-rentals/cedar-hill/">Cedar Hill</a>' out/service-areas/index.html && grep -q '<a class="chip" href="/party-rentals/desoto/">DeSoto</a>' out/service-areas/index.html && grep -q '<a class="chip" href="/party-rentals/waxahachie/">Waxahachie</a>' out/service-areas/index.html && grep -q '<a class="chip" href="/party-rentals/red-oak/">Red Oak</a>' out/service-areas/index.html && grep -q '<a class="chip" href="/party-rentals/duncanville/">Duncanville</a>' out/service-areas/index.html && grep -q '<li><a href="/party-rentals/cedar-hill/">Cedar Hill</a></li>' out/index.html && grep -q '<li><a href="/party-rentals/desoto/">DeSoto</a></li>' out/index.html && grep -q '<li><a href="/party-rentals/waxahachie/">Waxahachie</a></li>' out/index.html && grep -q '<li><a href="/party-rentals/red-oak/">Red Oak</a></li>' out/index.html && grep -q '<li><a href="/party-rentals/duncanville/">Duncanville</a></li>' out/index.html && grep -q '<li><a href="/party-rentals/cedar-hill/">Cedar Hill</a></li>' out/party-rentals/desoto/index.html && grep -q '<li><a href="/party-rentals/desoto/">DeSoto</a></li>' out/party-rentals/cedar-hill/index.html && grep -q '<li><a href="/party-rentals/red-oak/">Red Oak</a></li>' out/party-rentals/waxahachie/index.html && grep -q '<li><a href="/party-rentals/duncanville/">Duncanville</a></li>' out/party-rentals/red-oak/index.html && grep -q '<li><a href="/party-rentals/waxahachie/">Waxahachie</a></li>' out/party-rentals/duncanville/index.html && test -e out/seating-calculator/index.html && test -e out/quinceanera-rentals/index.html && test -e out/corporate-event-rentals/index.html && grep -q '<loc>https://raysrental.com/corporate-event-rentals/</loc>' out/sitemap.xml && ! grep -q '<loc>https://raysrental.com/tap/</loc>' out/sitemap.xml && grep -q '<meta name="robots" content="noindex,follow">' out/tap/index.html && grep -q 'id="google-review" href="https://g.page/r/CfLZlXdq8RP7EBM/review"' out/tap/index.html && ! grep -q 'maps.google.com' out/tap/index.html && grep -q '<a href="/corporate-event-rentals/">Corporate</a><a class="nav-cta" href="/quote/">Build a Quote</a>' out/index.html && grep -q '<a href="/corporate-event-rentals/">Corporate</a><a class="nav-cta" href="/quote/">Build a Quote</a>' out/corporate-event-rentals/index.html && grep -q '<loc>https://raysrental.com/seating-calculator/</loc>' out/sitemap.xml && grep -q '<loc>https://raysrental.com/quinceanera-rentals/</loc>' out/sitemap.xml && grep -q 'href="/seating-calculator/"' out/inventory/index.html && grep -q 'href="/seating-calculator/"' out/quote/index.html && grep -q 'href="/seating-calculator/"' out/quinceanera-rentals/index.html && grep -q 'href="/quinceanera-rentals/"' out/event-rentals/index.html && grep -q 'href="/quinceanera-rentals/"' out/party-rentals/dallas/index.html && grep -q 'href="/quinceanera-rentals/"' out/party-rentals/fort-worth/index.html && grep -q 'href="/quinceanera-rentals/"' out/seating-calculator/index.html && node scripts/assert-new-pages.mjs && node scripts/assert-quote-bar.mjs && node scripts/assert-phone.mjs'''
