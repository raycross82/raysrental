[build]
# Literal string ('''): no TOML escaping, so the sed expressions read as-is.
# site-overlay/ holds hand-maintained pages layered on top of the zip contents.
# The old quote/thanks/ page lives inside raysrental-deploy.zip, so it is removed
# from the unpacked output rather than by rewriting the archive. This stays correct
# even if the archive is re-uploaded with the page still in it.
#
# raysrental-deploy.zip ALSO carries its own stale netlify.toml at the archive root.
# Unpacking it lands a netlify.toml inside the publish directory, which becomes the
# deploy's effective config and silently shadows this file -- its older, shorter
# redirect list wins and any rule added here is dropped without an error. Delete it
# after unpacking, and assert it is gone so a re-uploaded archive cannot regress this.
#
# reviews-section.html is injected into the homepage the same way promo-strip.html is,
# so the homepage stays owned by the archive. `sed '/pat/e cat file'` writes the file
# out BEFORE the matched line (GNU sed), which puts reviews ahead of the final CTA band.
# The footer "Reviews" link is appended after the Explore > Contact item on every page.
# Each injection is asserted below so a re-uploaded archive that moves these anchors
# fails the build instead of silently dropping the section or the link.
#
# Headings that run text straight into a <br> (`<h1>DFW Event Rentals<br>Made Easy</h1>`)
# read as one word to anything that flattens the markup -- screen readers, search
# snippets, copy/paste. A space is inserted before the break in every heading that has
# this shape. Purely a text-content fix: with white-space:normal a space at the end of a
# line is dropped during layout, so the rendered two-line heading is byte-for-byte the
# same on screen. This runs after the injections above so fragment headings are covered
# too, and the archive keeps owning the pages. The assertion is the general pattern
# rather than one string, so a re-uploaded archive that reintroduces it anywhere fails
# the build.
command = '''rm -rf out && mkdir out && unzip -o raysrental-deploy.zip -d out && unzip -o seo-update.zip -d out && cp -R site-overlay/. out/ && rm -f out/netlify.toml && rm -rf out/quote/thanks && sed -i '/<\/header>/r promo-strip.html' out/index.html && sed -i '/<section class="cta-band">/e cat reviews-section.html' out/index.html && find out -name '*.html' -exec sed -i 's|<li><a href="/contact/">Contact</a></li>|&<li><a href="/review/">Reviews</a></li>|' {} + && find out -name '*.html' -exec sed -i 's|\(<h[1-6][^>]*>[^<]*[^[:space:]]\)\(<br[^>]*>\)|\1 \2|g' {} + && sed -i 's|action="/quote/thanks/"|action="/thank-you/"|' out/quote/index.html && grep -q 'action="/thank-you/"' out/quote/index.html && grep -q 'id="reviews"' out/index.html && grep -q '<li><a href="/review/">Reviews</a></li>' out/index.html && grep -q '<li><a href="/review/">Reviews</a></li>' out/faq/index.html && grep -q '<h1>DFW Event Rentals <br>Made Easy</h1>' out/index.html && ! grep -rE '<h[1-6][^>]*>[^<]*[^[:space:]]<br' out --include='*.html' && test ! -e out/quote/thanks && test ! -e out/netlify.toml'''
publish = "out"

